<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code-Franken</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <main id="app">

        <h1>QR-Code-Franken</h1>
        <p class="subtitle">Erstelle eine Kisten und teile sie per QR-Code.</p>
        <p class="subtitle"><a href="dashboard.html">📂 Alle Kisten verwalten (Login nötig)</a></p>

        <form id="list-form">

            <label for="list-title">Titel</label>
            <input
                type="text"
                id="list-title"
                placeholder="z. B. Zeltkiste"
                required>

            <label>Einträge</label>
            <div id="items" class="items">
                <div class="item-row">
                    <input type="text" class="item-input" placeholder="Eintrag" required>
                    <button type="button" class="remove-item" aria-label="Eintrag entfernen">✕</button>
                </div>
            </div>

            <button type="button" id="add-item-btn" class="btn-secondary">
                + Eintrag hinzufügen
            </button>

            <button type="submit" id="generate-btn" class="btn-primary">
                QR-Code erzeugen
            </button>

        </form>

        <div id="result" class="result hidden">

            <div id="qr-code"></div>

            <div>
                <strong>Link im QR-Code (zum Anzeigen &amp; Bearbeiten)</strong>
                <div class="link-row">
                    <div><a id="edit-link" target="_blank" rel="noopener"></a></div>
                    <button type="button" class="copy-btn" data-copy-target="edit-link">Kopieren</button>
                </div>
            </div>

            <div class="edit-hint">
                <strong>Nur-Lese-Link (zum Teilen ohne Bearbeitungsrecht)</strong>
                <div class="link-row">
                    <div><a id="view-link" target="_blank" rel="noopener"></a></div>
                    <button type="button" class="copy-btn" data-copy-target="view-link">Kopieren</button>
                </div>
            </div>

        </div>

    </main>

    <!-- Bibliotheken -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Eigene JavaScript-Dateien -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
